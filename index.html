<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella_Rating</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 1100px; margin: 20px auto; padding: 0 10px; line-height: 1.6; color: #333; }
        .box { border: 2px dashed #ccc; padding: 20px; margin-bottom: 15px; background: #f9f9f9; border-radius: 5px; }
        .box:hover { border-color: #888; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #downloadBtn { background-color: #28a745; }
        #downloadBtn:hover { background-color: #218838; }
        #saveImgBtn { background-color: #17a2b8; }
        #saveImgBtn:hover { background-color: #138496; }
        #output { white-space: pre-wrap; background: #222; color: #fff; padding: 15px; border-radius: 5px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        .info { color: #17a2b8; }
        
        /* 画像化するターゲットエリア全体のスタイル */
        #resultCaptureArea {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
        }

        /* 総合実力指標のダッシュボード表示 */
        .rating-card {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }
        .rating-title { font-size: 18px; letter-spacing: 1px; opacity: 0.9; }
        .rating-value { font-size: 48px; font-weight: bold; margin: 5px 0; color: #e4e4e4; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .rating-desc { font-size: 12px; opacity: 0.7; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; background-color: #ffffff; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        
        /* 順位列のデザイン */
        .rank-col { font-weight: bold; text-align: center; color: #666; width: 40px; }
        
        /* 上位10件専用のプレミアムハイライト */
        .top10 { background-color: #fce5cd !important; font-weight: bold; }
        .top10 .rank-col { color: #b45f06; }
        .highlight-rate { color: #b45f06; font-weight: bold; }
        .score-idx { color: #0056b3; }
        
        /* ランプごとの指定文字色 */
        .lamp-FC { color: #4488ff; font-weight: bold; }     /* 水色 */
        .lamp-HARD { color: #cc0000; font-weight: bold; }   /* 赤色 */
        .lamp-NORMAL { color: #e6b800; font-weight: bold; } /* 黄色 */
        .lamp-EASY { color: #38761d; font-weight: bold; }   /* 緑色 */
    </style>
</head>
<body>

    <h1>Stella/Satellite難易度表実力評価ツール Stella_Rating</h1>
    <p>Score.dbを選択し、実行ボタンを押してください。</p>

    <div class="box">
        <h3>STEP 1: スコアデータベース（.dbファイル）を選択</h3>
        <input type="file" id="dbFile" accept=".db">
        <div id="dbStatus"></div>
    </div>

    <p style="text-align: center;">
        <button id="runBtn">処理を実行</button>
        <button id="downloadBtn" disabled>CSV形式でダウンロード</button>
        <button id="saveImgBtn" disabled>画像として保存 (PNG)</button>
    </p>

    <h3>処理結果ログ</h3>
    <div id="output">システムロード中...</div>

    <div id="resultCaptureArea" style="display:none;">

        <div class="rating-card" id="ratingCard">
            <div class="rating-title">総合実力指標 (Total Rating)</div>
            <div class="rating-value" id="ratingValue">0.00</div>
            <div class="rating-desc">※ 計算式: (上位10曲の単曲レート×2 + 11〜30位の単曲レート合計) / 40</div>
        </div>

        <div id="previewArea" style="display:none;">
            <h3 style="margin-top: 20px; border-left: 4px solid #1f4068; padding-left: 8px;">総合評価ランキング プレビュー (上位30件)</h3>
            <table id="previewTable">
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>単曲レート</th>
                        <th>スコア倍率</th>
                        <th>level</th>
                        <th>title</th>
                        <th>clear</th>
                        <th>perfect</th>
                        <th>great</th>
                        <th>good</th>
                        <th>bad</th>
                        <th>poor</th>
                        <th>totalnotes</th>
                    </tr>
                </thead>
                <tbody id="previewBody"></tbody>
            </table>
        </div>

    </div>

    <script>
        let SQL;
        let dbInstance = null;
        let jsonMetaMap = {}; 
        let isJsonReady = false;
        let finalResultList = [];
        // CSV出力用のヘッダー定義
        const allHeaders = ['順位', '単曲レート', 'スコア倍率', 'level', 'title', 'clear', 'perfect', 'great', 'good', 'bad', 'poor', 'totalnotes'];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
                log("システム: ライブラリの初期化完了。");

                log("難易度表データを自動読込中...");
                let slCount = await loadJsonFile('sl_score.json', 'sl');
                log(`Satellite (sl_score.json) から ${slCount} 曲登録しました。`);
                
                let stCount = await loadJsonFile('st_score.json', 'st');
                log(`Stella (st_score.json) から ${stCount} 曲登録しました。`);
                
                isJsonReady = true;
                log("システム準備完了。.dbファイルを選択して実行してください。", "success");
            } catch (err) {
                log("初期化エラー: " + err.message, "error");
                log("※ローカルで直接HTMLを開いている場合はCORSエラーになります。GitHub Pagesにアップロードすると解消されます。", "info");
            }
        });

        function log(message, className = "") {
            const output = document.getElementById('output');
            if (output.innerHTML === "システムロード中...") output.innerHTML = "";
            const div = document.createElement('div');
            div.className = className;
            div.innerText = message;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        async function loadJsonFile(url, type) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${url} の読み込みに失敗しました。`);
            const jsonData = await response.json();
            
            let items = Array.isArray(jsonData) ? jsonData : [];
            if (!Array.isArray(jsonData) && typeof jsonData === 'object') {
                for (let k in jsonData) { if (Array.isArray(jsonData[k])) items = items.concat(jsonData[k]); }
            }
            
            let count = 0;
            items.forEach(item => {
                if (item && item.md5) {
                    // levelの表記揺れ対策（既にsl/stが付いていればそのまま、無ければ付与する）
                    let rawLevel = item.level !== undefined ? String(item.level) : "-";
                    let formattedLevel = rawLevel;
                    if (!rawLevel.toLowerCase().startsWith('sl') && !rawLevel.toLowerCase().startsWith('st')) {
                        formattedLevel = type + rawLevel; // 例: "12" -> "sl12" / "0" -> "st0"
                    }

                    jsonMetaMap[item.md5.toLowerCase()] = {
                        title: item.title || "Unknown",
                        level: formattedLevel, 
                        type: type
                    };
                    count++;
                }
            });
            return count;
        }

        document.getElementById('dbFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    dbInstance = new SQL.Database(new Uint8Array(e.target.result));
                    document.getElementById('dbStatus').innerHTML = `<span class="success">✓ ${file.name} を読み込みました。</span>`;
                    log(`ファイル読み込み完了: ${file.name}`);
                } catch (err) {
                    document.getElementById('dbStatus').innerHTML = `<span class="error">✕ 読み込み失敗</span>`;
                    log("エラー: 有効なデータベースファイルではありません: " + err.message, "error");
                    dbInstance = null;
                }
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('runBtn').addEventListener('click', function() {
            if (!isJsonReady) { alert("難易度表JSONの読み込みが完了していません。"); return; }
            if (!dbInstance) { alert("先にSTEP 1でDBファイルを選択してください。"); return; }

            log("\n--- 総合評価処理を開始します ---");
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('saveImgBtn').disabled = true;
            document.getElementById('resultCaptureArea').style.display = 'none';
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('ratingCard').style.display = 'none';
            finalResultList = [];

            try {
                const columnsResult = dbInstance.exec("PRAGMA table_info(score);");
                if (columnsResult.length === 0) { log("エラー: 'score' テーブルが見つかりません。", "error"); return; }
                const dbColumns = columnsResult[0].values.map(row => row[1]);

                let hashCol = dbColumns.includes('hash') ? 'hash' : (dbColumns.includes('md5') ? 'md5' : null);
                if (!hashCol) { log("エラー: hashまたはmd5カラムが見つかりません。", "error"); return; }

                const dbTargetCols = ['clear', 'perfect', 'great', 'good', 'bad', 'poor', 'totalnotes'];
                const validCols = dbTargetCols.filter(col => dbColumns.includes(col));
                
                const query = `SELECT ${[hashCol].concat(validCols).join(', ')} FROM score`;
                const dbResult = dbInstance.exec(query);

                if (dbResult.length === 0 || !dbResult[0].values) {
                    log("score テーブルにデータが存在しません。", "error");
                    return;
                }

                const dbRows = dbResult[0].values;
                const dbHeaders = dbResult[0].columns;

                dbRows.forEach(row => {
                    const hIdx = dbHeaders.indexOf(hashCol);
                    const dbHash = row[hIdx] ? row[hIdx].toLowerCase() : '';

                    if (jsonMetaMap[dbHash]) {
                        const meta = jsonMetaMap[dbHash];
                        const cIdx = dbHeaders.indexOf('clear');
                        const clearValue = cIdx !== -1 ? row[cIdx] : 0;

                        if (clearValue === 1 || clearValue === 0) return;

                        let rawLevelStr = String(meta.level);
                        let numericLevel = parseFloat(rawLevelStr.replace(/[^0-9.]/g, ''));
                        if (isNaN(numericLevel)) numericLevel = 0;

                        if (meta.type === 'st') numericLevel += 13;

                        let bonus = 0;
                        let clearText = "-";
                        let lampClass = "";
                        if (clearValue === 2) { bonus = 0; clearText = "EASY"; lampClass = "lamp-EASY"; }
                        else if (clearValue === 3) { bonus = 1.2; clearText = "NORMAL"; lampClass = "lamp-NORMAL"; }
                        else if (clearValue === 4) { bonus = 2; clearText = "HARD"; lampClass = "lamp-HARD"; } 
                        else if (clearValue === 5) { bonus = 6; clearText = "FULLCOMBO"; lampClass = "lamp-FC"; }
                        else return; 

                        let baseValue = numericLevel + bonus;

                        const getNum = (colName) => {
                            const idx = dbHeaders.indexOf(colName);
                            return idx !== -1 && !isNaN(parseFloat(row[idx])) ? parseFloat(row[idx]) : null;
                        };

                        const perf = getNum('perfect');
                        const grt = getNum('great');
                        const gd = getNum('good');
                        const total = getNum('totalnotes');

                        let scoreIndex = 1.0; 
                        if (perf !== null && grt !== null && gd !== null && total && total > 0) {
                            scoreIndex = (perf * 1.0 + grt * 0.9 + gd * 0.8) / total;
                            if (scoreIndex < 0) scoreIndex = 0;
                        }

                        let finalScoreValue = baseValue * scoreIndex;

                        finalResultList.push({
                            '順位': 0, 
                            '単曲レート': finalScoreValue,
                            'スコア倍率': scoreIndex,
                            level: meta.level, 
                            title: meta.title,
                            clear: clearText,
                            lampClass: lampClass,
                            perfect: perf !== null ? perf : "-",
                            great: grt !== null ? grt : "-",
                            good: gd !== null ? gd : "-",
                            bad: getNum('bad') !== null ? getNum('bad') : "-",
                            poor: getNum('poor') !== null ? getNum('poor') : "-",
                            totalnotes: total !== null ? total : "-"
                        });
                    }
                });

                log(`有効データ: マッチしたクリア済みの楽曲 ${finalResultList.length} 件を計算しました。`);

                if (finalResultList.length > 0) {
                    finalResultList.sort((a, b) => b['単曲レート'] - a['単曲レート']);

                    finalResultList.forEach((item, index) => {
                        item['順位'] = index + 1;
                    });

                    let weightedSum = 0;
                    finalResultList.forEach((item, index) => {
                        if (index < 10) weightedSum += item['単曲レート'] * 2; 
                        else if (index >= 10 && index < 30) weightedSum += item['単曲レート'] * 1; 
                    });
                    
                    let totalRating = weightedSum / 40;
                    
                    // 表示エリアの可視化
                    document.getElementById('resultCaptureArea').style.display = 'block';
                    document.getElementById('ratingCard').style.display = 'block';
                    document.getElementById('ratingValue').innerText = totalRating.toFixed(2);
                    document.getElementById('previewArea').style.display = 'block';

                    const tbody = document.getElementById('previewBody');
                    tbody.innerHTML = '';
                    
                    finalResultList.slice(0, 30).forEach((item, index) => {
                        const tr = document.createElement('tr');
                        if (index < 10) tr.className = 'top10'; 
                        
                        tr.innerHTML = `
                            <td class="rank-col">${item['順位']}</td>
                            <td class="highlight-rate">${item['単曲レート'].toFixed(2)}</td>
                            <td class="score-idx">${item['スコア倍率'].toFixed(4)}</td>
                            <td><b>${item.level}</b></td>
                            <td>${item.title}</td>
                            <td class="${item.lampClass}">${item.clear}</td>
                            <td>${item.perfect}</td>
                            <td>${item.great}</td>
                            <td>${item.good}</td>
                            <td>${item.bad}</td>
                            <td>${item.poor}</td>
                            <td>${item.totalnotes}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('downloadBtn').disabled = false;
                    document.getElementById('saveImgBtn').disabled = false; // 画像保存を有効化
                    log(`「総合実力指標」の算出に成功しました！画像保存も可能です。`, "success");
                } else {
                    log("対象となる有効なスコアデータがありませんでした。");
                }

            } catch (err) {
                log("エラーが発生しました: " + err.message, "error");
                console.error(err);
            }
        });

        // 画像保存ボタンのイベント
        document.getElementById('saveImgBtn').addEventListener('click', function() {
            const target = document.getElementById('resultCaptureArea');
            if (!target) return;

            log("リザルト画像を生成中...");
            
            html2canvas(target, {
                scale: 2, // 高画質化
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = imgData;
                link.download = `bms_result_rating_${new Date().toISOString().slice(0,10)}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                log("リザルト画像をPNGファイルとして保存しました！", "success");
            }).catch(err => {
                log("画像生成中にエラーが発生しました: " + err.message, "error");
                console.error(err);
            });
        });

        // CSVダウンロード
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (finalResultList.length === 0) return;
            let csvContent = '\uFEFF' + allHeaders.join(',') + '\r\n';
            finalResultList.forEach(item => {
                const row = allHeaders.map(h => {
                    let val = item[h];
                    if (h === '単曲レート' && typeof val === 'number') val = val.toFixed(2);
                    if (h === 'スコア倍率' && typeof val === 'number') val = val.toFixed(4);
                    if (typeof val === 'string') return `"${val.replace(/"/g, '""')}"`;
                    return val;
                });
                csvContent += row.join(',') + '\r\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "bms_total_rating.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
